system:
  mode: paper          # paper | live
  environment: demo    # demo | production
  log_level: INFO
  log_dir: ./logs

schedule:
  prediction_interval_minutes: 5
  market_hours:
    # CME Globex: Sun 6PM – Fri 5PM ET (1hr break 5-6PM daily)
    start: "18:00"
    end: "17:00"
    timezone: "America/New_York"
  flatten_eod: true    # Close all positions end of day (prop firm safe)

model:
  device: auto         # auto | cuda | mps | cpu
  weights_path: ./models/lat_pfn_checkpoint.ckpt
  lat_pfn_repo: ./Lat-PFN
  n_context: 16
  n_heldout: 4
  n_history: 180
  n_prompt: 60
  n_bins: 100
  bin_range_min: -3.5
  bin_range_max: 3.5

instruments:
  MYM:
    name: "Micro E-Mini Dow Futures"
    yfinance_ticker: "YM=F"         # same price as full-size
    tradovate_symbol: "MYM"
    contract_size: 0.50     # $0.50 per point (1/10th of YM)
    tick_size: 1.0
    tick_value: 0.50
    context_assets:
      - "SPY"    # S&P 500 ETF
      - "DIA"    # Dow ETF
      - "^VIX"   # Volatility Index
      - "DX-Y.NYB"  # Dollar Index
      - "^TNX"   # 10-Year Treasury Yield
      - "XLF"    # Financial sector
      - "XLI"    # Industrial sector
      - "IWM"    # Russell 2000

  MNQ:
    name: "Micro E-Mini Nasdaq Futures"
    yfinance_ticker: "NQ=F"         # same price as full-size
    tradovate_symbol: "MNQ"
    contract_size: 2        # $2 per point (1/10th of NQ)
    tick_size: 0.25
    tick_value: 0.50
    context_assets:
      - "QQQ"    # Nasdaq ETF
      - "SPY"    # S&P 500 ETF
      - "^VIX"   # Volatility
      - "^TNX"   # 10-Year Treasury
      - "XLK"    # Technology sector
      - "AAPL"   # Apple
      - "MSFT"   # Microsoft
      - "NVDA"   # NVIDIA

  MES:
    name: "Micro E-Mini S&P 500 Futures"
    yfinance_ticker: "ES=F"
    tradovate_symbol: "MES"
    contract_size: 5.0        # $5 per point (1/10th of ES)
    tick_size: 0.25
    tick_value: 1.25
    context_assets:
      - "SPY"    # S&P 500 ETF
      - "DIA"    # Dow ETF
      - "QQQ"    # Nasdaq ETF
      - "^VIX"   # Volatility Index
      - "^TNX"   # 10-Year Treasury Yield
      - "XLF"    # Financial sector
      - "XLK"    # Technology sector
      - "IWM"    # Russell 2000

  M2K:
    name: "Micro Russell 2000 Futures"
    yfinance_ticker: "RTY=F"
    tradovate_symbol: "M2K"
    contract_size: 5.0        # $5 per point (1/10th of RTY)
    tick_size: 0.10
    tick_value: 0.50
    context_assets:
      - "IWM"    # Russell 2000 ETF
      - "SPY"    # S&P 500 ETF
      - "^VIX"   # Volatility Index
      - "^TNX"   # 10-Year Treasury Yield
      - "XLF"    # Financial sector
      - "XLI"    # Industrial sector
      - "XLK"    # Technology sector
      - "KRE"    # Regional Banks ETF

  # MGC: TEMPORARILY DISABLED — Apex halted all metals (GC, SI, MGC, HG, PL, PA)
  # due to market volatility. Re-enable when Apex lifts the restriction.
  # MGC:
  #   name: "Micro Gold Futures"
  #   yfinance_ticker: "GC=F"
  #   tradovate_symbol: "MGC"
  #   contract_size: 10
  #   tick_size: 0.10
  #   tick_value: 1.0
  #   context_assets:
  #     - "GLD"
  #     - "SLV"
  #     - "DX-Y.NYB"
  #     - "^TNX"
  #     - "TIP"
  #     - "DBC"
  #     - "UUP"
  #     - "^VIX"

  # ── DIVERSIFICATION — OIL & FX ───────────────────────────────
  # Uncorrelated asset classes for portfolio diversification.
  # Remember to add MCL and M6E symbol mappings in PickMyTrade dashboard.

  MCL:
    name: "Micro WTI Crude Oil Futures"
    yfinance_ticker: "CL=F"
    tradovate_symbol: "MCL"
    contract_size: 100       # $100 per point (100 barrels × $1/barrel)
    tick_size: 0.01
    tick_value: 1.00
    context_assets:
      - "USO"    # United States Oil Fund
      - "XLE"    # Energy Select Sector
      - "^VIX"   # Volatility Index
      - "DX-Y.NYB"  # Dollar Index (oil inversely correlated)
      - "^TNX"   # 10-Year Treasury Yield
      - "XOP"    # Oil & Gas Exploration ETF
      - "SPY"    # S&P 500 (macro sentiment)
      - "UNG"    # Natural Gas ETF (energy sector)

  M6E:
    name: "Micro EUR/USD Futures"
    yfinance_ticker: "EURUSD=X"
    tradovate_symbol: "M6E"
    contract_size: 12500     # $12,500 notional (12,500 euros × rate)
    tick_size: 0.0001
    tick_value: 1.25
    context_assets:
      - "FXE"    # Euro Currency ETF
      - "DX-Y.NYB"  # Dollar Index (directly inverse)
      - "^VIX"   # Volatility Index
      - "^TNX"   # 10-Year Treasury (rate differentials)
      - "EWG"    # Germany ETF (Eurozone proxy)
      - "UUP"    # Dollar Bullish ETF
      - "GLD"    # Gold (often moves with EUR vs USD)
      - "SPY"    # S&P 500 (risk sentiment)

  M6B:
    name: "Micro GBP/USD Futures"
    yfinance_ticker: "GBPUSD=X"
    tradovate_symbol: "M6B"
    contract_size: 6250      # $6,250 notional (6,250 GBP × rate)
    tick_size: 0.0001
    tick_value: 0.625
    context_assets:
      - "FXB"    # British Pound ETF
      - "DX-Y.NYB"  # Dollar Index
      - "^VIX"   # Volatility Index
      - "^TNX"   # 10-Year Treasury
      - "EWU"    # UK ETF
      - "UUP"    # Dollar Bullish ETF
      - "GLD"    # Gold
      - "SPY"    # S&P 500

  M6A:
    name: "Micro AUD/USD Futures"
    yfinance_ticker: "AUDUSD=X"
    tradovate_symbol: "M6A"
    contract_size: 10000     # $10,000 notional (10,000 AUD × rate)
    tick_size: 0.0001
    tick_value: 1.00
    context_assets:
      - "FXA"    # Australian Dollar ETF
      - "DX-Y.NYB"  # Dollar Index
      - "^VIX"   # Volatility Index
      - "^TNX"   # 10-Year Treasury
      - "EWA"    # Australia ETF
      - "USO"    # Oil (AUD correlates with commodities)
      - "GLD"    # Gold (Australia is major gold exporter)
      - "SPY"    # S&P 500

  M6J:
    name: "Micro JPY/USD Futures"
    yfinance_ticker: "JPYUSD=X"
    tradovate_symbol: "M6J"
    contract_size: 1250000   # ¥1,250,000 notional
    tick_size: 0.0000005
    tick_value: 0.625
    context_assets:
      - "FXY"    # Japanese Yen ETF
      - "DX-Y.NYB"  # Dollar Index
      - "^VIX"   # Volatility Index
      - "^TNX"   # 10-Year Treasury
      - "EWJ"    # Japan ETF
      - "UUP"    # Dollar Bullish ETF
      - "GLD"    # Gold (safe haven correlation)
      - "SPY"    # S&P 500

risk:
  max_risk_per_trade_pct: 2.0    # 2% of account equity ($1000 on $50k)
  max_position_size_contracts: 5   # micros are 1/10th size, can safely trade more
  max_daily_loss_pct: 3.0
  max_drawdown_pct: 10.0
  max_concurrent_positions: 6
  stop_loss_atr_multiplier: 1.5
  min_reward_risk_ratio: 1.5
  trailing_stop_activation_pct: 2.0
  trailing_stop_distance_pct: 1.0

  # Portfolio exposure limits (MES-equivalent)
  # 1 MNQ=$2/pt = 0.4 MES-eq, 1 MYM=$0.50/pt = 0.1 MES-eq
  # 1 MES=$5/pt = 1.0 MES-eq, 1 M2K=$5/pt = 1.0 MES-eq
  max_net_mes_equivalent: 6.0     # Max net directional exposure (6 diversified positions)
  max_gross_mes_equivalent: 10.0  # Max total (long+short) exposure

  prop_firm:
    starting_balance: 50000      # Account starting balance
    max_daily_loss_usd: 1000     # Conservative daily loss limit
    max_total_drawdown_usd: 2500 # $50k account trailing drawdown ($50k - $2.5k = $47.5k floor)
    profit_target_usd: 3000      # Profit target to pass eval ($50k + $3k = $53k)
    flatten_eod: true
    flatten_time: "16:55"        # Hard flatten at 4:55 PM ET (4min before 4:59 deadline)
    no_new_trades_after: "16:45" # Stop opening positions after 4:45 PM ET
    max_risk_reward_ratio: 5.0   # Apex 5:1 max risk-to-reward
    mae_pct: 0.30                # 30% MAE rule — max unrealized loss per trade
    consistency_pct: 0.30        # 30% consistency rule — max single day as % of total

signal:
  min_confidence: 0.25   # absolute floor (below this = no trade regardless of tier)
  regime_multipliers:
    trending: 1.15
    ranging: 0.95       # was 0.8 — too punitive since most markets range most of the time
    volatile: 0.75
  weights:
    model_confidence: 0.4
    trend_clarity: 0.3
    uncertainty_inverse: 0.3

# ── NBA Shot-Tier Classification ──────────────────────────────────
# Each tier maps a confidence range to specific trade parameters.
# Higher confidence → tighter target + full size (bread & butter).
# Lower confidence  → wider target + smaller size (occasional windfall).
# All tiers should be EV-positive: Win% × Target > Loss% × Stop.
# Disable any tier by setting enabled: false.

shot_tiers:
  layup:
    label: "Layup"
    confidence_min: 0.60       # composite 0.60+ (strong conviction)
    target_multiplier: 0.4     # 40% of base forecast target (very tight)
    stop_multiplier: 0.8       # 80% of base stop (tight protection)
    size_multiplier: 1.0       # full position
    min_reward_risk: 1.0       # accept 1:1 R:R (high win rate compensates)
    enabled: true

  short_range:
    label: "Short Range"
    confidence_min: 0.52       # composite 0.52–0.60
    target_multiplier: 0.6     # 60% of base target
    stop_multiplier: 0.9
    size_multiplier: 1.0
    min_reward_risk: 1.2
    enabled: true

  free_throw:
    label: "Free Throw"
    confidence_min: 0.45       # composite 0.45–0.52
    target_multiplier: 0.8
    stop_multiplier: 1.0
    size_multiplier: 0.75      # 3/4 position
    min_reward_risk: 1.5
    enabled: true

  three_pointer:
    label: "3-Pointer"
    confidence_min: 0.38       # composite 0.38–0.45
    target_multiplier: 1.2     # 120% of base (wider target)
    stop_multiplier: 1.2       # wider stop too
    size_multiplier: 0.5       # half position
    min_reward_risk: 2.0
    enabled: true

  half_court:
    label: "Half Court"
    confidence_min: 0.32       # composite 0.32–0.38
    target_multiplier: 2.0     # 2x base target
    stop_multiplier: 1.5
    size_multiplier: 0.25      # quarter position
    min_reward_risk: 3.0
    enabled: false             # disabled by default — enable after backtest validates

  hail_mary:
    label: "Hail Mary"
    confidence_min: 0.25       # composite 0.25–0.32
    target_multiplier: 3.5     # 3.5x base target (moonshot)
    stop_multiplier: 1.5
    size_multiplier: 0.15      # minimum position
    min_reward_risk: 5.0
    enabled: false             # disabled by default — lottery ticket

# ── Execution Mode ───────────────────────────────────────────────
# pickmytrade = webhook to PickMyTrade (works with Apex prop firm)
# tradovate   = direct Tradovate API (requires paid API access)
# dry_run     = predictions only, no orders placed
execution:
  mode: pickmytrade    # pickmytrade | tradovate | dry_run
  default_equity: 50000  # used when broker can't report balance
  # Confirmation mode: require Discord approval before each trade
  # SET TO true FOR PA/LIVE ACCOUNTS (Apex requires human oversight)
  # Set to false for evaluation accounts (automation more permissive)
  confirmation_mode: false   # false=auto-execute, true=require Discord approval
  confirmation_timeout: 60   # seconds to wait for approval before auto-rejecting

pickmytrade:
  webhook_url: "https://api.pickmytrade.trade/v2/add-trade-data-latest"
  # Credentials loaded from environment variables:
  #   PICKMYTRADE_TOKEN      — your webhook token from pickmytrade.trade
  #   PICKMYTRADE_ACCOUNT_ID — your account ID from pickmytrade.trade

# ── Discord Bot ──────────────────────────────────────────────────
# Posts signals, cycle summaries, and accepts slash commands.
# Credentials loaded from environment variables:
#   DISCORD_BOT_TOKEN   — bot token from discord.com/developers
#   DISCORD_CHANNEL_ID  — channel ID for signal posting
discord:
  channel_id: "1470827087085441078"   # Trading Pilot channel
  # alert_role_id: ""                 # Optional: Discord role ID for @mentions
  #   Set this to a role ID to @mention that role on trade alerts.
  #   Leave empty to use @here instead (notifies all online members).
  #   To get role ID: Server Settings → Roles → right-click → Copy ID

tradovate:
  mode: demo
  api_url: "https://demo.tradovateapi.com/v1"
  md_url: "wss://md-demo.tradovateapi.com/v1/websocket"
  ws_url: "wss://demo.tradovateapi.com/v1/websocket"
  live_api_url: "https://live.tradovateapi.com/v1"
  live_md_url: "wss://md.tradovateapi.com/v1/websocket"
  live_ws_url: "wss://live.tradovateapi.com/v1/websocket"
