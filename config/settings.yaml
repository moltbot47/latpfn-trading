risk:
  max_risk_per_trade_pct: 15.0   # 15% of account equity (aggressive — manual oversight, watching closely)
  max_position_size_contracts: 20  # high cap for crypto fractional sizing
  max_daily_loss_pct: 3.0
  max_drawdown_pct: 10.0
  max_concurrent_positions: 10
  stop_loss_atr_multiplier: 1.5
  min_reward_risk_ratio: 1.5
  scalp_min_reward_risk_ratio: 0.3  # global floor for scalp mode
  trailing_stop_activation_pct: 2.0
  trailing_stop_distance_pct: 1.0

  # Portfolio exposure limits (MES-equivalent)
  # 1 MNQ=$2/pt = 0.4 MES-eq, 1 MYM=$0.50/pt = 0.1 MES-eq
  # 1 MES=$5/pt = 1.0 MES-eq, 1 MBT=$0.10/pt = 0.02 MES-eq
  # 1 10Y=$10/pt = 2.0 MES-eq
  max_net_mes_equivalent: 15.0    # Raised from 8.0 — was blocking MES every cycle
  max_gross_mes_equivalent: 25.0  # Raised from 12.0 — allow 3-4 concurrent positions

  prop_firm:
    starting_balance: 50000      # Account starting balance
    max_daily_loss_usd: 1000     # Conservative daily loss limit
    max_total_drawdown_usd: 2500 # $50k account trailing drawdown ($50k - $2.5k = $47.5k floor)
    profit_target_usd: 3000      # Profit target to pass eval ($50k + $3k = $53k)
    flatten_eod: true
    flatten_time: "16:55"        # Hard flatten at 4:55 PM ET (4min before 4:59 deadline)
    no_new_trades_after: "16:45" # Stop opening positions after 4:45 PM ET
    max_risk_reward_ratio: 5.0   # Apex 5:1 max risk-to-reward
    mae_pct: 0.30                # 30% MAE rule — max unrealized loss per trade
    consistency_pct: 0.30        # 30% consistency rule — max single day as % of total
    daily_profit_cap_usd: 1660   # Match biggest day ($1,660.25) — don't create a new worst day
                                  # Ensures consistency rule compliance: no single day dominates total

signal:
  min_confidence: 0.25   # absolute floor (below this = no trade regardless of tier)
  # Hyperliquid override: crypto is noisier, use lower floor
  min_confidence_hyperliquid: 0.15
  regime_multipliers:
    trending: 1.15
    ranging: 0.95       # was 0.8 — too punitive since most markets range most of the time
    volatile: 0.75
  # Hyperliquid regime overrides: crypto is always volatile, don't punish as hard
  regime_multipliers_hyperliquid:
    trending: 1.15
    ranging: 1.0
    volatile: 0.85       # was 0.75 — crypto vol is normal, not penalizing
  weights:
    model_confidence: 0.4
    trend_clarity: 0.3
    uncertainty_inverse: 0.3
  trend_filter:
    enabled: true
    fast_ema_period: 50     # ~4 hours on 5-min bars
    slow_ema_period: 200    # ~16 hours on 5-min bars
    mode: soft              # gate = hard reject, soft = 0.7x penalty
    # Hyperliquid override: soft mode applies penalty instead of blocking
    mode_hyperliquid: soft
  # ── Time-Based Volatility Boost ──────────────────────────────
  # Adjusts confidence based on time of day (all times ET).
  # NYSE open = highest edge, lunch = lowest, power hour = moderate.
  # Also speeds up cycle interval during hot windows.
  time_boost:
    enabled: true
    fast_cycle_minutes: 2       # cycle speed during hot windows (vs 5min default)
    fast_cycle_windows: [nyse_open, open_continuation, pre_macro]
    windows:
      pre_macro:
        start: "08:25"
        end: "08:35"
        cme_boost: 1.20
        crypto_boost: 1.15
      nyse_open:
        start: "09:30"
        end: "10:00"
        cme_boost: 1.25         # +25% confidence during NYSE open
        crypto_boost: 1.20
      open_continuation:
        start: "10:00"
        end: "10:30"
        cme_boost: 1.15
        crypto_boost: 1.10
      lunch_zone:
        start: "12:00"
        end: "14:00"
        cme_boost: 0.85         # -15% confidence during lunch
        crypto_boost: 0.90
      power_hour:
        start: "15:30"
        end: "16:00"
        cme_boost: 1.10
        crypto_boost: 1.05

# ── NBA Shot-Tier Classification ──────────────────────────────
# Each tier maps a confidence range to specific trade parameters.
# Higher confidence → tighter target + full size (bread & butter).
# Lower confidence  → wider target + smaller size (occasional windfall).
# All tiers should be EV-positive: Win% × Target > Loss% × Stop.
# Disable any tier by setting enabled: false.

shot_tiers:
  layup:
    label: "Layup"
    confidence_min: 0.60       # composite 0.60+ (strong conviction)
    target_multiplier: 0.4     # 40% of base forecast target (very tight)
    stop_multiplier: 0.8       # 80% of base stop (tight protection)
    size_multiplier: 1.0       # full position
    min_reward_risk: 1.0       # accept 1:1 R:R (high win rate compensates)
    enabled: true

  short_range:
    label: "Short Range"
    confidence_min: 0.52       # composite 0.52–0.60
    target_multiplier: 0.6     # 60% of base target
    stop_multiplier: 0.9
    size_multiplier: 1.0
    min_reward_risk: 1.2
    enabled: true

  free_throw:
    label: "Free Throw"
    confidence_min: 0.45       # composite 0.45–0.52
    target_multiplier: 0.8
    stop_multiplier: 1.0
    size_multiplier: 0.75      # 3/4 position
    min_reward_risk: 1.5
    enabled: true

  three_pointer:
    label: "3-Pointer"
    confidence_min: 0.38       # composite 0.38–0.45
    target_multiplier: 1.2     # 120% of base (wider target)
    stop_multiplier: 1.2       # wider stop too
    size_multiplier: 0.5       # half position
    min_reward_risk: 2.0
    enabled: true

  half_court:
    label: "Half Court"
    confidence_min: 0.32       # composite 0.32–0.38
    target_multiplier: 2.0     # 2x base target
    stop_multiplier: 1.5
    size_multiplier: 0.25      # quarter position
    min_reward_risk: 3.0
    enabled: true

  hail_mary:
    label: "Hail Mary"
    confidence_min: 0.25       # composite 0.25–0.32
    target_multiplier: 3.5     # 3.5x base target (moonshot)
    stop_multiplier: 1.5
    size_multiplier: 0.15      # minimum position
    min_reward_risk: 5.0
    enabled: false             # disabled by default — lottery ticket

# ── Strategy Mode ────────────────────────────────────────────
# standard = current behavior (far-term targets, wide R:R)
# scalp    = near-term targets, tight R:R, max hold times
strategy:
  mode: standard               # standard | scalp — PF backtest: standard 1.58-1.85 vs scalp 0.41-1.55
  scalp:
    forecast_bar_start: 3      # use bars 3-12 for target (vs 50-60)
    forecast_bar_end: 12
    uncertainty_deduction: 0.3 # less conservative (vs 0.5 in standard)
    min_target_stop_ratio: 0.15 # min target as fraction of stop (lower = tighter targets)
    # Profit manager overrides
    trailing_stop_activation_pct: 0.30
    trailing_stop_distance_pct: 0.20
    tighten_stop_pct: 0.60
    close_pct: 0.85
    min_hold_minutes: 3
    max_consecutive_losses: 5  # pause after 5 straight losses
    cooldown_minutes: 30       # cooldown after loss streak

# ── Scalp Mode Shot Tiers ────────────────────────────────────
# Only used when strategy.mode = "scalp"
# Same confidence thresholds, tighter exits for near-term capture
scalp_tiers:
  dunk:
    label: "Scalp Dunk"
    confidence_min: 0.70         # only the strongest signals
    forecast_bar_start: 1        # bars 1-5 (5-25 min) — per-tier override
    forecast_bar_end: 5
    target_multiplier: 0.10      # 10% of near-term forecast (ultra-tight)
    stop_multiplier: 0.5         # tight stop — fast exit on wrong direction
    size_multiplier: 1.0         # full size (highest confidence)
    min_reward_risk: 0.25        # must be >= 0.20 for Apex 5:1 R:R compliance
    max_hold_minutes: 10         # close profitable trades after 10 min
    enabled: true

  alley_oop:
    label: "Scalp Alley-Oop"
    confidence_min: 0.65         # very strong signals
    forecast_bar_start: 1        # bars 1-7 (5-35 min)
    forecast_bar_end: 7
    target_multiplier: 0.15      # 15% of near-term forecast
    stop_multiplier: 0.6
    size_multiplier: 1.0
    min_reward_risk: 0.25        # must be >= 0.20 for Apex 5:1 R:R compliance
    max_hold_minutes: 15
    enabled: true

  layup:
    label: "Scalp Layup"
    confidence_min: 0.60         # now captures 0.60-0.65 range
    target_multiplier: 0.25    # 25% of near-term forecast
    stop_multiplier: 0.7
    size_multiplier: 1.0
    min_reward_risk: 0.3       # needs 77% WR to breakeven
    max_hold_minutes: 45       # close profitable trades after 45 min
    enabled: true

  short_range:
    label: "Scalp Short Range"
    confidence_min: 0.52
    target_multiplier: 0.30
    stop_multiplier: 0.8
    size_multiplier: 1.0
    min_reward_risk: 0.35      # needs 74% WR
    max_hold_minutes: 60
    enabled: true

  free_throw:
    label: "Scalp Free Throw"
    confidence_min: 0.45
    target_multiplier: 0.40
    stop_multiplier: 0.9
    size_multiplier: 0.75
    min_reward_risk: 0.4       # needs 71% WR
    max_hold_minutes: 75
    enabled: true

  three_pointer:
    label: "Scalp 3-Pointer"
    confidence_min: 0.38
    target_multiplier: 0.55
    stop_multiplier: 1.0
    size_multiplier: 0.5
    min_reward_risk: 0.5       # needs 67% WR
    max_hold_minutes: 90
    enabled: true

  half_court:
    label: "Scalp Half Court"
    confidence_min: 0.32
    target_multiplier: 0.70
    stop_multiplier: 1.1
    size_multiplier: 0.25
    min_reward_risk: 0.6       # needs 63% WR
    max_hold_minutes: 120
    enabled: true

# ── Execution Mode ───────────────────────────────────────────
# traderspost = webhook to TradersPost (works with Apex prop firm via Tradovate)
# pickmytrade = webhook to PickMyTrade (trial expired)
# tradovate   = direct Tradovate API (requires paid API access)
# dry_run     = predictions only, no orders placed
execution:
  mode: traderspost    # traderspost | pickmytrade | tradovate | hyperliquid | dry_run
  default_equity: 50000  # used when broker can't report balance
  # Confirmation mode: require Discord approval before each trade
  # SET TO true FOR PA/LIVE ACCOUNTS (Apex requires human oversight)
  # Set to false for evaluation accounts (automation more permissive)
  confirmation_mode: false   # false=auto-execute, true=require Discord approval
  confirmation_timeout: 60   # seconds to wait for approval before auto-rejecting

traderspost:
  webhook_url: "https://webhooks.traderspost.io/trading/webhook/181afda0-f15f-4870-ba52-d0560c5a24f4/01a3f0cf9b6d0f8eccd605a239dec77b"
  # Auth is embedded in the URL — no separate API key needed
  # Rate limits: 60 requests/min, 500 requests/hour
  # Docs: https://docs.traderspost.io/docs/core-concepts/signals/webhooks

pickmytrade:
  webhook_url: "https://api.pickmytrade.trade/v2/add-trade-data-latest"
  # DEPRECATED: PickMyTrade trial expired. Using TradersPost now.
  # Credentials loaded from environment variables:
  #   PICKMYTRADE_TOKEN      — your webhook token from pickmytrade.trade
  #   PICKMYTRADE_ACCOUNT_ID — your account ID from pickmytrade.trade

# ── Discord Bot ────────────────────────────────────────────
