    yfinance_ticker: "NQ=F"         # same price as full-size
    tradovate_symbol: "MNQ"
    contract_size: 2        # $2 per point (1/10th of NQ)
    tick_size: 0.25
    tick_value: 0.50
    # Backtest 02/12: 41 trades, PF 1.56, +$1538
    # LIVE 02/19-02/23: 72 trades, 61.1% WR, +$1,668, PF 1.53 (confirmed edge)
    # Top earner — consistent across backtest and live
    allowed_tiers: [dunk, alley_oop, layup, short_range, three_pointer]
    context_assets:
      - "QQQ"    # Nasdaq ETF
      - "SPY"    # S&P 500 ETF
      - "^VIX"   # Volatility
      - "^TNX"   # 10-Year Treasury
      - "XLK"    # Technology sector
      - "AAPL"   # Apple
      - "MSFT"   # Microsoft
      - "NVDA"   # NVIDIA

