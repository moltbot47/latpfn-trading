# ── Polymarket Prediction Market Trading ─────────────────────────────
polymarket:
  enabled: true
  budget_usdc: 119.71
  cycle_minutes: 10
  max_concurrent_positions: 160
  strategy_limits:
    resolution_snipe: 5
    superforecaster: 5
    max_concurrent: 45
    crypto_scalp: 3
    turbo: 100
  sniper:
    min_yes_price: 0.85
    max_yes_price: 0.97
    max_hours_to_resolution: 48
    min_volume_24h: 10000
    max_position_pct: 0.20
    stop_price: 0.80
  forecaster:
    enabled: false               # disabled — saving LLM tokens
    model: "claude-sonnet-4-6"
    min_divergence: 0.10
    max_divergence: 0.40
    min_market_volume: 5000
    max_position_pct: 0.15
    confidence_threshold: 0.70
    cache_hours: 4
    max_concurrent_forecasts: 5
  scalper:
    enabled: false               # disabled — negative PnL
    assets: ["btc"]              # Start with BTC, add eth/sol later
    entry_threshold: 0.82        # Buy when outcome hits 82%+
    max_entry_price: 0.95        # Don't buy above 95% (too little edge)
    min_seconds_left: 15         # Don't trade with <15s left (won't fill)
    max_seconds_left: 120        # Don't trade with >2min left (too uncertain)
    max_position_pct: 0.15       # Max 15% of budget per scalp
    shares_per_trade: 10         # Fixed 10 shares per trade (~$8-9)
    cooldown_windows: 1          # Skip N windows after a trade
  max_concurrent:
    enabled: false               # disabled — saving LLM tokens
    budget_pct: 0.35             # 35% of balance for this strategy
    bet_size_usdc: 5.0           # ~1% of $482 balance per position
    min_divergence: 0.07         # Lower threshold than superforecaster (0.10)
    max_divergence: 0.40
    max_positions: 45            # Max concurrent positions for this strategy
    max_trades_per_cycle: 20     # Don't open >20 in one cycle
    exit_hours: 4                # Time-based exit after 4 hours
    stop_loss_pct: 30            # Exit if down 30%
    scan_limit: 100              # Markets to scan (vs 50 for superforecaster)
    max_concurrent_forecasts: 8  # Parallel LLM calls
    confidence_threshold: 0.60   # Lower than superforecaster (0.70)
  turbo:
    enabled: true
    poll_seconds: 5                # Tick every 5 seconds
    bet_size_usdc: 1.0             # Back to $1 — investigating regime-dependent edge loss
    assets: ["btc", "eth", "sol", "xrp"]  # Crypto assets to trade
    timeframes: ["5m", "15m"]      # Window durations
    max_positions: 50              # Max concurrent turbo positions
    momentum_threshold: 0.0003     # 0.03% min price move for signal
    min_seconds_left: 30           # Don't trade <30s before close
    max_seconds_left: 240          # Don't trade >4min before close
    min_entry_edge: 0.02           # Min edge (buy below 0.52)
    cooldown_windows: 0            # Skip N windows after trade (0=none)
    claim_interval_seconds: 300    # Auto-claim every 5 minutes
  daily_loss_limit_pct: 25.0
  max_portfolio_exposure: 1.50
