[project]
name = "latpfn-trading"
version = "1.0.0"
description = "Automated futures trading using LaT-PFN zero-shot time-series forecasting"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"funding/cli.py" = ["F401"]
"funding/pdf_parser.py" = ["F541"]
"scripts/funding_dashboard.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"tests/test_core.py" = ["E402"]

[tool.coverage.run]
source = ["funding"]
omit = ["funding/cli.py", "funding/discord_commands.py", "funding/embeds.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
