<svg xmlns="http://www.w3.org/2000/svg" width="250" height="250" viewBox="0 0 250 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#0c0c0c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="250" height="250" rx="32" fill="url(#bg)"/>

  <!-- Border glow -->
  <rect x="1" y="1" width="248" height="248" rx="31" fill="none" stroke="#767676" stroke-width="1" opacity="0.3"/>

  <!-- Scanlines -->
  <g opacity="0.04">
    <line x1="0" y1="20" x2="250" y2="20" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="40" x2="250" y2="40" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="60" x2="250" y2="60" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="80" x2="250" y2="80" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="100" x2="250" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="250" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="140" x2="250" y2="140" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="160" x2="250" y2="160" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="180" x2="250" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="250" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="220" x2="250" y2="220" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="250" y2="240" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Mini chart line (abstract candlestick/signal representation) -->
  <polyline points="40,170 60,160 80,165 100,140 120,145 140,120 160,130 180,105 200,110 220,90"
    fill="none" stroke="#16c60c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <polyline points="40,170 60,160 80,165 100,140 120,145 140,120 160,130 180,105 200,110 220,90"
    fill="none" stroke="#16c60c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Signal dots on chart -->
  <circle cx="100" cy="140" r="3" fill="#16c60c" opacity="0.8"/>
  <circle cx="140" cy="120" r="3" fill="#16c60c" opacity="0.8"/>
  <circle cx="200" cy="110" r="3" fill="#e74856" opacity="0.8"/>

  <!-- Main text: LaT-PFN -->
  <text x="125" y="95" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Consolas', monospace" font-weight="700" font-size="36" fill="#61d6d6" letter-spacing="-1">LaT-PFN</text>

  <!-- Subtitle -->
  <text x="125" y="118" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Consolas', monospace" font-weight="400" font-size="12" fill="#767676" letter-spacing="2">SIGNALS</text>

  <!-- Live pulse dot -->
  <circle cx="210" cy="40" r="6" fill="#16c60c" opacity="0.9"/>
  <circle cx="210" cy="40" r="10" fill="none" stroke="#16c60c" stroke-width="1.5" opacity="0.3">
    <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom bar: "ON BASE" -->
  <rect x="80" y="205" width="90" height="22" rx="4" fill="none" stroke="#3b78ff" stroke-width="1" opacity="0.5"/>
  <text x="125" y="220" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Consolas', monospace" font-weight="700" font-size="10" fill="#3b78ff" letter-spacing="2">ON BASE</text>
</svg>
