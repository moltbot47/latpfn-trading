system:
  mode: live          # paper | live
  environment: production    # demo | production
  log_level: INFO
  log_dir: ./logs

schedule:
  prediction_interval_minutes: 5
  market_hours:
    # CME Globex: Sun 6PM – Fri 5PM ET (1hr break 5-6PM daily)
    start: "18:00"
    end: "17:00"
    timezone: "America/New_York"
  flatten_eod: true    # Close all positions end of day (prop firm safe)

model:
  device: auto         # auto | cuda | mps | cpu
  weights_path: ./models/lat_pfn_checkpoint.ckpt
  lat_pfn_repo: ./Lat-PFN
  n_context: 16
  n_heldout: 4
  n_history: 180
  n_prompt: 60
  n_bins: 100
  bin_range_min: -3.5
  bin_range_max: 3.5

instruments:
  MYM:
    name: "Micro E-Mini Dow Futures"
    yfinance_ticker: "YM=F"         # same price as full-size
    tradovate_symbol: "MYM"
    contract_size: 0.50     # $0.50 per point (1/10th of YM)
    tick_size: 1.0
    tick_value: 0.50
    # Backtest 02/12: 26 trades, 34.6% WR, -$452, PF 0.45 (weak in backtest)
    # LIVE 02/19-02/23: 48 trades, 50.0% WR, +$256, PF 1.54 (profitable live)
    allowed_tiers: [dunk, alley_oop, layup, short_range, free_throw, three_pointer, half_court]
    context_assets:
      - "SPY"    # S&P 500 ETF
      - "DIA"    # Dow ETF
      - "^VIX"   # Volatility Index
      - "DX-Y.NYB"  # Dollar Index
      - "^TNX"   # 10-Year Treasury Yield
      - "XLF"    # Financial sector
      - "XLI"    # Industrial sector
      - "IWM"    # Russell 2000

