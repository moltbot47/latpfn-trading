name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install CPU-only PyTorch first
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check tests/ funding/ scripts/funding_dashboard.py scripts/backup.py monitoring/logger.py

      - name: Run all tests
        run: python -m pytest tests/ -v --tb=short -x

      - name: Run funding tests with coverage
        run: |
          python -m pytest tests/test_funding_models.py \
            tests/test_funding_database.py \
            tests/test_funding_strategy.py \
            tests/test_funding_api.py \
            tests/test_monitoring.py \
            --cov=funding.database \
            --cov=funding.models \
            --cov=funding.product_catalog \
            --cov=funding.strategy_engine \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --tb=short
