  md_url: "wss://md-demo.tradovateapi.com/v1/websocket"
  ws_url: "wss://demo.tradovateapi.com/v1/websocket"
  live_api_url: "https://live.tradovateapi.com/v1"
  live_md_url: "wss://md.tradovateapi.com/v1/websocket"
  live_ws_url: "wss://live.tradovateapi.com/v1/websocket"

# ── Hyperliquid DEX ─────────────────────────────────────────
# Decentralized perpetual futures on Hyperliquid L1.
# Parallel execution mode — trades crypto perps with separate capital.
# Credentials loaded from environment variables:
#   HYPERLIQUID_PRIVATE_KEY     — wallet private key
#   HYPERLIQUID_WALLET_ADDRESS  — wallet address
hyperliquid:
  enabled: true              # re-enabled — provides intel to turbo via agent bus
  network: mainnet           # mainnet | testnet
  default_leverage: 20       # aggressive — manual oversight active
  order_type: limit          # limit (0.02% maker rebate) vs market (0.035% taker)
  slippage_tolerance: 0.1    # % offset on limit orders for fill probability
  account_equity: 30         # separate from Apex equity (updates from live balance)
  max_concurrent_positions: 15  # more slots = more diversification across pairs
  daily_loss_limit_pct: 30.0   # 30% = $9 on $30 — aggressive scalping
  cycle_minutes: 1             # 1-min cycles — max speed with native API
  top_pairs: 50                # scan 50 pairs — cast wide net for momentum

# ── Hyperliquid Instruments ─────────────────────────────────
# Used when execution.mode = "hyperliquid"
# contract_size = 1.0 for all crypto perps (USD notional per coin unit)
# Add more pairs as you discover edge via backtesting.
instruments_hyperliquid:
  BTC:
    name: "Bitcoin Perpetual"
    yfinance_ticker: "BTC-USD"
    contract_size: 1.0
    tick_size: 0.1
    tick_value: 0.1
    allowed_tiers: [dunk, alley_oop, layup, short_range, free_throw, three_pointer]
    context_assets:
      - "ETH-USD"
      - "^VIX"
      - "SPY"
      - "QQQ"
      - "GLD"
      - "DX-Y.NYB"
      - "COIN"
      - "MSTR"

  ETH:
    name: "Ethereum Perpetual"
