version: "3.9"

services:
  funding-dashboard:
    build: .
    ports:
      - "5055:5055"
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5055/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
