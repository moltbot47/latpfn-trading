system:
  mode: paper          # paper | live
  environment: demo    # demo | production
  log_level: INFO
  log_dir: ./logs

schedule:
  prediction_interval_minutes: 5
  market_hours:
    # CME Globex: Sun 6PM – Fri 5PM ET (1hr break 5-6PM daily)
    start: "18:00"
    end: "17:00"
    timezone: "America/New_York"
  flatten_eod: true    # Close all positions end of day (prop firm safe)

model:
  device: auto         # auto | cuda | mps | cpu
  weights_path: ./models/lat_pfn_checkpoint.ckpt
  lat_pfn_repo: ./Lat-PFN
  n_context: 16
  n_heldout: 4
  n_history: 180
  n_prompt: 60
  n_bins: 100
  bin_range_min: -3.5
  bin_range_max: 3.5

instruments:
  MYM:
    name: "Micro E-Mini Dow Futures"
    yfinance_ticker: "YM=F"         # same price as full-size
    tradovate_symbol: "MYM"
    contract_size: 0.50     # $0.50 per point (1/10th of YM)
    tick_size: 1.0
    tick_value: 0.50
    # Backtest 02/12 confirmation: 26 trades, 34.6% WR, -$452, PF 0.45
    # Both tiers losing in isolation: three_pointer (PF 0.25), half_court (PF 0.84)
    # WARNING: MYM model has weak/inconsistent edge — monitor closely
    allowed_tiers: [three_pointer, half_court]
    context_assets:
      - "SPY"    # S&P 500 ETF
      - "DIA"    # Dow ETF
      - "^VIX"   # Volatility Index
      - "DX-Y.NYB"  # Dollar Index
      - "^TNX"   # 10-Year Treasury Yield
      - "XLF"    # Financial sector
      - "XLI"    # Industrial sector
      - "IWM"    # Russell 2000

  MNQ:
    name: "Micro E-Mini Nasdaq Futures"
    yfinance_ticker: "NQ=F"         # same price as full-size
    tradovate_symbol: "MNQ"
    contract_size: 2        # $2 per point (1/10th of NQ)
    tick_size: 0.25
    tick_value: 0.50
    # Backtest 02/12: 41 trades, PF 1.56, +$1538
    # Winners: layup, short_range, free_throw, three_pointer
    # half_court confirmed 0% WR, -$1087 in confirmation run — removed
    allowed_tiers: [layup, short_range, free_throw, three_pointer]
    context_assets:
      - "QQQ"    # Nasdaq ETF
      - "SPY"    # S&P 500 ETF
      - "^VIX"   # Volatility
      - "^TNX"   # 10-Year Treasury
      - "XLK"    # Technology sector
      - "AAPL"   # Apple
      - "MSFT"   # Microsoft
      - "NVDA"   # NVIDIA

  MES:
    name: "Micro E-Mini S&P 500 Futures"
    yfinance_ticker: "ES=F"
    tradovate_symbol: "MES"
    contract_size: 5.0        # $5 per point (1/10th of ES)
    tick_size: 0.25
    tick_value: 1.25
    # Backtest 02/12: 37 trades, 43.2% WR, +$383, PF 1.27
    # Winners: short_range (PF 3.22), layup (PF 1.21), three_pointer (PF 1.07)
    # free_throw confirmed PF 0.62, -$86 in confirmation run — removed
    allowed_tiers: [layup, short_range, three_pointer]
    context_assets:
      - "SPY"    # S&P 500 ETF
      - "DIA"    # Dow ETF
      - "QQQ"    # Nasdaq ETF
      - "^VIX"   # Volatility Index
      - "^TNX"   # 10-Year Treasury Yield
      - "XLF"    # Financial sector
      - "XLK"    # Technology sector
      - "IWM"    # Russell 2000

